apiVersion: v1
kind: PersistentVolume
metadata:
  name: spark-data-pv
spec:
  capacity:
    storage: 1Gi

  accessModes:
    - ReadWriteMany

  hostPath:
    path: /run/desktop/mnt/host/d/Privat/PySpark/k8s-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-data-pvc
  namespace: spark
spec:
  accessModes:
    - ReadWriteMany

  resources:
    requests:
      storage: 1Gi